#
# Test apps: asio
#
# test
target_test_apps_asio_test:
  extends:
    - .target_test_template
    - .rules:build:test_apps_asio_test
  needs:
    - job: "build_test_apps_asio_test"
      artifacts: true
      optional: true
  parallel:
    matrix: !reference [.target_test_idf_target_version_general_matrix]
  tags:
    - ${IDF_TARGET}
    - ${ENV_TAG}
  variables:
    TEST_TARGET: ${IDF_TARGET}
    TEST_FOLDER: test_apps/asio/test
    TEST_ENV: ${ENV_TAG}

